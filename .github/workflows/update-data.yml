name: 데이터 갱신

# 데이터 수집과 GitHub Pages 배포를 이 워크플로 하나에서 한다.
# (Pages 배포 소스가 "GitHub Actions"라서 pages-build-deployment 기록이 따로 생기지 않는다)
on:
  schedule:
    # GitHub 예약 실행은 정시에 몰려 몇 시간씩 늦거나 빠지기도 해서, 정각을 피한 시각에 여러 번 돌린다.
    # 새 데이터가 없으면 커밋 없이 끝나므로 자주 돌려도 페이지·기록에는 영향이 없다.
    - cron: "10 23 * * 0-4"   # 평일 08:10 KST
    - cron: "10 3 * * 1-5"    # 평일 12:10 KST
    - cron: "10 7 * * 1-5"    # 평일 16:10 KST
    - cron: "10 8 * * 1-5"    # 평일 17:10 KST
    - cron: "40 9 * * 1-5"    # 평일 18:40 KST
    - cron: "10 12 * * 1-5"   # 평일 21:10 KST
  workflow_dispatch:
    inputs:
      keep:
        description: "남길 실행 기록 수"
        default: "10"
  push:
    branches: [main]
    paths: ["docs/**"]       # 페이지를 직접 고쳐 올렸을 때 배포

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 금융투자협회 데이터 받기
        if: github.event_name != 'push'
        run: |
          python fetch_kofia.py
          python make_csv.py
      - name: 바뀐 데이터 커밋
        id: commit
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- docs/data/fund.csv docs/data/credit.csv docs/data/shares.csv docs/data/index.csv; then
            echo "새 데이터 없음"
            git checkout -- docs/data
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "데이터 갱신: $(tail -1 docs/data/fund.csv | cut -d, -f1)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: 페이지 묶기
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Pages 배포
        id: deploy
        uses: actions/deploy-pages@v5

  # 이 워크플로의 실행 기록은 최근 10개만 남기고 지운다 (실행 중인 것은 건드리지 않음)
  cleanup:
    needs: [update, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: ${{ inputs.keep || '10' }}
    steps:
      - name: 오래된 실행 기록 삭제
        run: |
          ids=$(gh run list -R "$GITHUB_REPOSITORY" -w update-data.yml -L 200 \
                  --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId' \
                | tail -n +$((KEEP + 1)))
          for id in $ids; do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" && echo "삭제: $id"
          done
          echo "정리 완료"
